# BBS Cubed 构建配置（Fabric）
# 1.20.1 构建为唯一发布产物，单 jar 同时兼容 1.20.1 ~ 1.20.4
# -Pmc_version=1.20.4 仅作为编译回归测试目标（runClient1204），不单独发布
# 兼容范围声明：游戏 1.20.1 ~ 1.20.4，Java 17 ~ 21

# ---- 目标平台（可用 -Pmc_version=1.20.4 覆盖；1.20.4 仅测试用）----
mc_version=1.20.1
# 以下两个全局值保留给旧脚本/IDE 默认 run config 兜底；实际按版本从 _<mc> 后缀的 key 读取
minecraft_version=1.20.1
yarn_mappings=1.20.1+build.10
loader_version=0.18.1
java_version=17

# fabric.mod.json 中声明的兼容范围（processResources 会按 targetMc 覆盖）
minecraft_version_range=>=1.20.1 <=1.20.4
loader_version_range=>=0.15.0
java_version_range=>=17 <22

# 模组坐标
mod_id=bbsplusplus
mod_name=BBS Cubed
mod_version=3.6.7
mod_group_id=gbeic
mod_license=LGPL-3.0-or-later
archives_base_name=BBS-Cubed

# 构建插件
loom_version=1.15.5

# ---- 各游戏版本依赖坐标（1.20.1）----
yarn_mappings_1.20.1=1.20.1+build.10
loader_version_1.20.1=0.18.1
fabric_api_version_1.20.1=0.92.12+1.20.1
iris_version_1.20.1=1.7.0+1.20.1
aaa_particles_version_1.20.1=fabric-1.20.1-2.2.3
forgeconfigapiport_version_1.20.1=8.0.0
architectury_version_1.20.1=9.2.14
# BBS 编译期 jar（modCompileOnly，隔离在 libs/，不进 runClient 运行时）；
# run/1.20.1/mods 中保留实际运行版本。升级 BBS 后同步改这里的文件名。
bbs_jar_1.20.1=libs/archive/bbs-2.7/bbs-2.7-1.20.1-zh_CN.jar

# ---- 各游戏版本依赖坐标（1.20.4）----
yarn_mappings_1.20.4=1.20.4+build.3
loader_version_1.20.4=0.18.1
fabric_api_version_1.20.4=0.96.4+1.20.4
iris_version_1.20.4=1.7.2+1.20.4
# aaa_particles 无 1.20.4 版本：1.20.4 构建沿用 1.20.1 的 jar 作编译期依赖（compileOnly），运行时该功能自动禁用
aaa_particles_version_1.20.4=fabric-1.20.1-2.2.3
forgeconfigapiport_version_1.20.4=20.4.3
architectury_version_1.20.4=11.1.17
bbs_jar_1.20.4=libs/archive/bbs-2.7/bbs-2.7-1.20.4.jar

# ---- 各游戏版本依赖坐标（1.21.11）----
# 参考 libs/bbs-fs-1.21.11/gradle.properties 与官方 fabricmc.net/develop
yarn_mappings_1.21.11=1.21.11+build.6
loader_version_1.21.11=0.19.3
fabric_api_version_1.21.11=0.141.4+1.21.11
# Iris 1.10.7 与 Sodium 0.8.7 绑定（见 BBS build.gradle L87-89）
iris_version_1.21.11=1.10.7+1.21.11-fabric
sodium_version_1.21.11=mc1.21.11-0.8.7-fabric
# AAA Particles 暂无 1.21.11 版本线（最高 1.21.1 / 26.1.x），沿用 1.20.1 jar 仅作编译期解析
aaa_particles_version_1.21.11=fabric-1.20.1-2.2.3
forgeconfigapiport_version_1.21.11=21.11.1
architectury_version_1.21.11=19.0.1
bbs_jar_1.21.11=libs/bbs-2.7-1.21.11.jar
