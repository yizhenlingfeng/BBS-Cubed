plugins {
    id 'fabric-loom' version "${loom_version}"
}

// ---- 目标版本切换 ----
// 默认构建 1.20.1，单 jar 同时兼容 1.20.1 ~ 1.20.4（同一源码双版本编译的产物
// intermediary 引用已验证零漂移）；-Pmc_version=1.20.4 仅作为编译回归测试目标
// （runClient1204），不再单独发布 1.20.4 jar。
def targetMc = providers.gradleProperty("mc_version").orElse("1.20.1").get()

// gradle.properties 中的属性名含小数点，必须用 providers.gradleProperty 读取
def gprop = { name -> providers.gradleProperty(name).get() }

def versions = [
        "1.20.1": [
                minecraft_version : "1.20.1",
                // 发布 jar 后缀：该构建同时兼容 1.20.4
                release_suffix   : "1.20.1-1.20.4",
                yarn_mappings    : gprop("yarn_mappings_1.20.1"),
                loader_version   : gprop("loader_version_1.20.1"),
                fabric_api       : gprop("fabric_api_version_1.20.1"),
                iris             : gprop("iris_version_1.20.1"),
                aaa_particles    : gprop("aaa_particles_version_1.20.1"),
                forgeconfigapiport: gprop("forgeconfigapiport_version_1.20.1"),
                architectury     : gprop("architectury_version_1.20.1"),
                bbs_jar          : gprop("bbs_jar_1.20.1"),
                // 1.20.1 下 aaa_particles 以 modImplementation 提供（runClient 需要）
                aaa_as_compile_only: false,
                java_release     : 17
        ],
        // 编译回归测试目标（runClient1204 用），不作为发布产物
        "1.20.4": [
                minecraft_version : "1.20.4",
                yarn_mappings    : gprop("yarn_mappings_1.20.4"),
                loader_version   : gprop("loader_version_1.20.4"),
                fabric_api       : gprop("fabric_api_version_1.20.4"),
                iris             : gprop("iris_version_1.20.4"),
                aaa_particles    : gprop("aaa_particles_version_1.20.4"),
                forgeconfigapiport: gprop("forgeconfigapiport_version_1.20.4"),
                architectury     : gprop("architectury_version_1.20.4"),
                bbs_jar          : gprop("bbs_jar_1.20.4"),
                // aaa_particles 无 1.20.4 版本，1.20.4 构建仅作编译期依赖
                aaa_as_compile_only: true,
                java_release     : 17
        ],
        "1.21.11": [
                minecraft_version : "1.21.11",
                yarn_mappings    : gprop("yarn_mappings_1.21.11"),
                loader_version   : gprop("loader_version_1.21.11"),
                fabric_api       : gprop("fabric_api_version_1.21.11"),
                iris             : gprop("iris_version_1.21.11"),
                aaa_particles    : gprop("aaa_particles_version_1.21.11"),
                forgeconfigapiport: gprop("forgeconfigapiport_version_1.21.11"),
                architectury     : gprop("architectury_version_1.21.11"),
                bbs_jar          : gprop("bbs_jar_1.21.11"),
                // aaa_particles 暂无 1.21.11 版本：仅编译期，运行时功能自动禁用
                aaa_as_compile_only: true,
                java_release     : 21
        ]
]

def mcVer = versions[targetMc]
if (mcVer == null) {
    throw new GradleException("不支持的 mc_version: ${targetMc}，支持：${versions.keySet().join(', ')}")
}

def minecraftVersion = mcVer.minecraft_version

// 按目标 MC 版本覆盖 fabric.mod.json 中声明的兼容范围（BBS 自身 1.21.11 用 ~1.21.11）
def versionRanges = [
        "1.20.1" : [mc: ">=1.20.1 <=1.20.4", loader: ">=0.15.0", java: ">=17 <22"],
        "1.20.4" : [mc: ">=1.20.1 <=1.20.4", loader: ">=0.15.0", java: ">=17 <22"],
        "1.21.11": [mc: "~1.21.11",          loader: ">=0.19.3", java: ">=21"]
]
def ranges = versionRanges[targetMc]
if (ranges == null) {
    throw new GradleException("未配置 ${targetMc} 的 version_range")
}
def minecraftVersionRange = ranges.mc
def javaVersionRange = ranges.java
def loaderVersionRange = ranges.loader

// 按版本隔离构建输出目录，防止 1.20.1 / 1.20.4 编译产物交叉污染
layout.buildDirectory = layout.projectDirectory.dir("build/${targetMc}")

base {
    archivesName = archives_base_name
}

// 无 release_suffix 的目标（测试构建 / 1.21.11）沿用 MC 版本号作后缀
version = "${mod_version}+${mcVer.release_suffix ?: minecraftVersion}"
group = mod_group_id

processResources {
    // version 用项目版本（含发布后缀），保证 jar 内元数据与文件名一致
    inputs.properties(
        version: version,
        mod_id: mod_id,
        mod_name: mod_name,
        mod_license: mod_license,
        minecraft_version_range: minecraftVersionRange,
        loader_version_range: loaderVersionRange,
        java_version_range: javaVersionRange
    )

    filesMatching("fabric.mod.json") {
        expand(
            version: version,
            mod_id: mod_id,
            mod_name: mod_name,
            mod_license: mod_license,
            minecraft_version_range: minecraftVersionRange,
            loader_version_range: loaderVersionRange,
            java_version_range: javaVersionRange
        )
    }

    // 1.21.11 需要 Mixin Java 21 字节码，主线保持 JAVA_17
    if (targetMc == "1.21.11") {
        filesMatching("*.mixins.json") {
            filter { line -> line.replace('"JAVA_17"', '"JAVA_21"') }
        }

        // 1.21.11 的 client 入口替换：
        // - BBSPlusPlusModClient 硬依赖 FilmAutoGameModeRestoreState 等被 excludes 的类，换成 12111 变体；
        // - BBSFSloveCMLClient 在该构建可直接编译（其 1.21.11-exclusive 依赖均为运行时反射检测），
        //   不再替换，避免维护一份 BBSFSloveCMLClient12111 双份代码。
        filesMatching("fabric.mod.json") {
            filter { line ->
                line.replace(
                    '"gbeic.bbsplusplus.client.BBSPlusPlusModClient"',
                    '"gbeic.bbsplusplus.client.BBSPlusPlusModClient12111"')
            }
        }

        // 从所有 mixins.json 里移除被 excludes 的 Mixin（目标类已变更/不存在）
        doLast {
            int totalRemoved = 0
            fileTree("build/1.21.11/resources/main/").matching { include "*.mixins.json" }.each { f ->
                def text = f.text
                sourceSets.main.java.excludes.each { excl ->
                    if (excl.contains("/mixin/") && excl.endsWith(".java")) {
                        def simpleName = excl.substring(excl.lastIndexOf('/') + 1).replace(".java", "")
                        def before = text.length()
                        // 匹配 "Name", 或 "Name"（最后一个元素）
                        text = text.replaceAll("\"${simpleName}\",?\\s*", "")
                        if (text.length() < before) totalRemoved++
                    }
                }
                f.text = text
            }
            println "Removed ${totalRemoved} excluded mixins from all mixins.json files"
        }
    }
}

repositories {
    // 国内镜像优先（加速 mavenCentral 等国外仓库）
    maven { url = "https://maven.aliyun.com/repository/public" }
    maven { url = "https://maven.aliyun.com/repository/gradle-plugin" }
    maven { url = "https://repo.huaweicloud.com/repository/maven/" }

    mavenCentral()
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
    }
    maven {
        name = "Architectury"
        url = "https://maven.architectury.dev/"
    }
    maven {
        name = "Gegy"
        url = "https://maven.gegy.dev/"
    }
    // Fuzs modresources 托管在 raw.githubusercontent.com，JVM TLS 握手在国内偶发 Connection reset。
    // 前置 ghproxy.net 镜像，失败时自动 fallback 到原仓库。
    maven {
        name = "Fuzs Mod Repository (ghproxy mirror)"
        url = "https://ghproxy.net/https://raw.githubusercontent.com/Fuzss/modresources/main/maven/"
    }
    maven {
        name = "Fuzs Mod Repository"
        url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/"
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraftVersion}"
    mappings "net.fabricmc:yarn:${mcVer.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${mcVer.loader_version}"

    // Fabric API（提供 ClientTickEvents、ClientLifecycleEvents 等）
    modImplementation "net.fabricmc.fabric-api:fabric-api:${mcVer.fabric_api}"

    // 本地 BBS FS（libs/ 隔离，modCompileOnly，不进 runClient 运行时）：编译期解析 Mixin 目标类
    modCompileOnly files(mcVer.bbs_jar)

    // Iris 光影（仅编译期）：光影曲线相关 Mixin 需要引用 Iris 的类，运行时没装 Iris 也不会加载这些注入
    modCompileOnly "maven.modrinth:iris:${mcVer.iris}"

    // AAA Particles 依赖（1.20.4 / 1.21.11 无对应版本：仅编译期，运行时功能自动禁用）
    if (mcVer.aaa_as_compile_only) {
        modCompileOnly "maven.modrinth:aaa-particles:${mcVer.aaa_particles}"
    } else {
        modImplementation "maven.modrinth:aaa-particles:${mcVer.aaa_particles}"
    }

    modImplementation "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${mcVer.forgeconfigapiport}"

    // aaa_particles 以 jar-in-jar 内置 architectury，但 loom dev 环境不解包嵌套 jar，
    // 需显式声明才能在 runClient 中加载；版本与内置一致，且不会打进最终产物
    modImplementation "dev.architectury:architectury-fabric:${mcVer.architectury}"

    // BBS VFX 与 VFX Lights（仅编译期）：轨道关键帧汉化需要引用其 Form 类做上下文判断，
    // 运行时由用户自行安装这两个插件。1.21.11 上这两个 jar 仍是 1.20.1 版，
    // 对应 Mixin 由 VfxMixinPlugin 在运行期守卫；编译期若类签名漂移再按需摘除。
    modCompileOnly files("libs/BBS-VFX-build-1.3-1.20.1-zh_cn-hardcoded.jar")
    modCompileOnly files("libs/VFX-LIGHTS-1.0-1.20.1-zh_cn-hardcoded.jar")
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    /* ParticlePlusClient 有意使用 sun.misc.Unsafe 注入枚举常量。
     * --release 17 下无法压制内部专用 API 警告，且 add-exports 与 --release 互斥，
     * 故 1.20.x 改用等价的 -source/-target 17 + -XDignore.symbol.file（与 FSloveCML 原构建一致）。
     * 1.21.5+ MC 强制 Java 21，直接走 --release 21。 */
    if (mcVer.java_release == 21) {
        it.options.release = 21
    } else {
        it.sourceCompatibility = "17"
        it.targetCompatibility = "17"
        it.options.compilerArgs += ["-XDignore.symbol.file", "-Xlint:-options"]
    }
}

