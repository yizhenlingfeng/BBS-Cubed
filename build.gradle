plugins {
    id 'fabric-loom' version "${loom_version}"
}

// ---- 目标版本切换 ----
// 默认构建 1.20.1，单 jar 同时兼容 1.20.1 ~ 1.20.4（同一源码双版本编译的产物
// intermediary 引用已验证零漂移）；-Pmc_version=1.20.4 仅作为编译回归测试目标
// （runClient1204），不再单独发布 1.20.4 jar。
def targetMc = providers.gradleProperty("mc_version").orElse("1.20.1").get()

// gradle.properties 中的属性名含小数点，必须用 providers.gradleProperty 读取
def gprop = { name -> providers.gradleProperty(name).get() }

def versions = [
        "1.20.1": [
                minecraft_version : "1.20.1",
                // 发布 jar 后缀：该构建同时兼容 1.20.4
                release_suffix   : "1.20.1-1.20.4",
                yarn_mappings    : gprop("yarn_mappings_1.20.1"),
                loader_version   : gprop("loader_version_1.20.1"),
                fabric_api       : gprop("fabric_api_version_1.20.1"),
                iris             : gprop("iris_version_1.20.1"),
                aaa_particles    : gprop("aaa_particles_version_1.20.1"),
                forgeconfigapiport: gprop("forgeconfigapiport_version_1.20.1"),
                architectury     : gprop("architectury_version_1.20.1"),
                bbs_jar          : gprop("bbs_jar_1.20.1"),
                // 1.20.1 下 aaa_particles 以 modImplementation 提供（runClient 需要）
                aaa_as_compile_only: false,
                java_release     : 17
        ],
        // 编译回归测试目标（runClient1204 用），不作为发布产物
        "1.20.4": [
                minecraft_version : "1.20.4",
                yarn_mappings    : gprop("yarn_mappings_1.20.4"),
                loader_version   : gprop("loader_version_1.20.4"),
                fabric_api       : gprop("fabric_api_version_1.20.4"),
                iris             : gprop("iris_version_1.20.4"),
                aaa_particles    : gprop("aaa_particles_version_1.20.4"),
                forgeconfigapiport: gprop("forgeconfigapiport_version_1.20.4"),
                architectury     : gprop("architectury_version_1.20.4"),
                bbs_jar          : gprop("bbs_jar_1.20.4"),
                // aaa_particles 无 1.20.4 版本，1.20.4 构建仅作编译期依赖
                aaa_as_compile_only: true,
                java_release     : 17
        ],
        "1.21.11": [
                minecraft_version : "1.21.11",
                yarn_mappings    : gprop("yarn_mappings_1.21.11"),
                loader_version   : gprop("loader_version_1.21.11"),
                fabric_api       : gprop("fabric_api_version_1.21.11"),
                iris             : gprop("iris_version_1.21.11"),
                aaa_particles    : gprop("aaa_particles_version_1.21.11"),
                forgeconfigapiport: gprop("forgeconfigapiport_version_1.21.11"),
                architectury     : gprop("architectury_version_1.21.11"),
                bbs_jar          : gprop("bbs_jar_1.21.11"),
                // aaa_particles 暂无 1.21.11 版本：仅编译期，运行时功能自动禁用
                aaa_as_compile_only: true,
                java_release     : 21
        ]
]

def mcVer = versions[targetMc]
if (mcVer == null) {
    throw new GradleException("不支持的 mc_version: ${targetMc}，支持：${versions.keySet().join(', ')}")
}

def minecraftVersion = mcVer.minecraft_version

// AAA Particles 2.3.4 未发布到 Modrinth，编译/开发运行优先使用仓库内本地 jar；
// 该文件缺失时回退到 gradle.properties 中的 Modrinth 坐标（2.2.3）。
// 必须用 orElse 而不是 get()：IDEA 的 Gradle 同步不会带上 -P 参数，get() 会让整个配置阶段
// 直接失败（"Cannot query the value of Gradle property ... because it has no value available"）。
def aaaLocalJarFile = file(providers.gradleProperty("aaa_particles_local_jar")
        .getOrElse("libs/aaa_particles-fabric-1.20.1-2.3.4.jar"))

// 按目标 MC 版本覆盖 fabric.mod.json 中声明的兼容范围（BBS 自身 1.21.11 用 ~1.21.11）
def versionRanges = [
        "1.20.1" : [mc: ">=1.20.1 <=1.20.4", loader: ">=0.15.0", java: ">=17 <22"],
        "1.20.4" : [mc: ">=1.20.1 <=1.20.4", loader: ">=0.15.0", java: ">=17 <22"],
        "1.21.11": [mc: "~1.21.11",          loader: ">=0.19.3", java: ">=21"]
]
def ranges = versionRanges[targetMc]
if (ranges == null) {
    throw new GradleException("未配置 ${targetMc} 的 version_range")
}
def minecraftVersionRange = ranges.mc
def javaVersionRange = ranges.java
def loaderVersionRange = ranges.loader

// 按版本隔离构建输出目录，防止 1.20.1 / 1.20.4 编译产物交叉污染
layout.buildDirectory = layout.projectDirectory.dir("build/${targetMc}")

base {
    archivesName = archives_base_name
}

// 无 release_suffix 的目标（测试构建 / 1.21.11）沿用 MC 版本号作后缀
version = "${mod_version}+${mcVer.release_suffix ?: minecraftVersion}"
group = mod_group_id


repositories {
    // 国内镜像优先（加速 mavenCentral 等国外仓库）
    maven { url = "https://maven.aliyun.com/repository/public" }
    maven { url = "https://maven.aliyun.com/repository/gradle-plugin" }
    maven { url = "https://repo.huaweicloud.com/repository/maven/" }

    mavenCentral()
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
    }
    maven {
        name = "Architectury"
        url = "https://maven.architectury.dev/"
    }
    maven {
        name = "Gegy"
        url = "https://maven.gegy.dev/"
    }
    // Fuzs modresources 托管在 raw.githubusercontent.com，JVM TLS 握手在国内偶发 Connection reset。
    // 前置 ghproxy.net 镜像，失败时自动 fallback 到原仓库。
    maven {
        name = "Fuzs Mod Repository (ghproxy mirror)"
        url = "https://ghproxy.net/https://raw.githubusercontent.com/Fuzss/modresources/main/maven/"
    }
    maven {
        name = "Fuzs Mod Repository"
        url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/"
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraftVersion}"
    mappings "net.fabricmc:yarn:${mcVer.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${mcVer.loader_version}"

    // Fabric API（提供 ClientTickEvents、ClientLifecycleEvents 等）
    modImplementation "net.fabricmc.fabric-api:fabric-api:${mcVer.fabric_api}"

    // 本地 BBS FS（libs/ 隔离，modCompileOnly，不进 runClient 运行时）：编译期解析 Mixin 目标类
    modCompileOnly files(mcVer.bbs_jar)

    // Iris 光影（仅编译期）：光影曲线相关 Mixin 需要引用 Iris 的类，运行时没装 Iris 也不会加载这些注入
    modCompileOnly "maven.modrinth:iris:${mcVer.iris}"

    // AAA Particles 依赖（1.20.4 / 1.21.11 无对应版本：仅编译期，运行时功能自动禁用）
    // 2.3.4 尚未发布到 Modrinth：优先使用仓库内 libs/ 下的本地 jar（1.20.1 下同时作为 dev 运行时依赖），
    // 文件缺失时回退到 Modrinth 坐标，保证未携带该 jar 的克隆仍能构建。
    if (aaaLocalJarFile.exists()) {
        if (mcVer.aaa_as_compile_only) {
            modCompileOnly files(aaaLocalJarFile)
        } else {
            modImplementation files(aaaLocalJarFile)
        }
    } else if (mcVer.aaa_as_compile_only) {
        modCompileOnly "maven.modrinth:aaa-particles:${mcVer.aaa_particles}"
    } else {
        modImplementation "maven.modrinth:aaa-particles:${mcVer.aaa_particles}"
    }

    modImplementation "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${mcVer.forgeconfigapiport}"

    // aaa_particles 以 jar-in-jar 内置 architectury，但 loom dev 环境不解包嵌套 jar，
    // 需显式声明才能在 runClient 中加载；版本与内置一致，且不会打进最终产物
    modImplementation "dev.architectury:architectury-fabric:${mcVer.architectury}"

    // BBS VFX 与 VFX Lights（仅编译期）：轨道关键帧汉化需要引用其 Form 类做上下文判断，
    // 运行时由用户自行安装这两个插件。1.21.11 上这两个 jar 仍是 1.20.1 版，
    // 对应 Mixin 由 VfxMixinPlugin 在运行期守卫；编译期若类签名漂移再按需摘除。
    modCompileOnly files("libs/BBS-VFX-build-1.3-1.20.1-zh_cn-hardcoded.jar")
    modCompileOnly files("libs/VFX-LIGHTS-1.0-1.20.1-zh_cn-hardcoded.jar")

    // Model Morph 的数学 / 映射校验单元测试：纯 JVM 运行，不启动客户端。
    // 映射数据类引用 BBS 的 MapType/BaseType，因此测试运行时需要 BBS jar 与 JOML 在类路径上。
    testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.11.4"
    testImplementation files(mcVer.bbs_jar)
    testImplementation "org.joml:joml:1.10.5"
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    testLogging {
        events "failed", "skipped"
        exceptionFormat "full"
    }
}

// 1.21.11 目标显式固定 JDK 21 工具链：编译用的 javac 与 Gradle 守护进程的 JVM 解耦，
// 这样即使 Gradle 跑在别的 JDK 上，javac 也不会报「不支持发行版本 21」。
// 1.20.x 不设 toolchain，保持“任意 17+ 的 JVM + -source/-target 17”的既有行为。
if (mcVer.java_release == 21) {
    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    /* ParticlePlusClient 有意使用 sun.misc.Unsafe 注入枚举常量。
     * --release 17 下无法压制内部专用 API 警告，且 add-exports 与 --release 互斥，
     * 故 1.20.x 改用等价的 -source/-target 17 + -XDignore.symbol.file（与 FSloveCML 原构建一致）。
     * 1.21.5+ MC 强制 Java 21，直接走 --release 21。 */
    if (mcVer.java_release == 21) {
        it.options.release = 21
    } else {
        it.sourceCompatibility = "17"
        it.targetCompatibility = "17"
        it.options.compilerArgs += ["-XDignore.symbol.file", "-Xlint:-options"]
    }
}

// 1.21.5+ GPU 渲染管线大修：以下文件引用了被移除/重写的立即模式 API
//（RenderSystem.enableBlend、Tessellator.getBuffer、ShaderProgram、GlUniform、
// AbstractTexture、BufferRenderer、WorldRenderEvents 等），在 1.21.11 构建时
// 暂时排除，待后续按新 RenderPipeline/RenderLayer API 逐文件重写。
// 1.20.1/1.20.4 构建不受影响。
if (targetMc == "1.21.11") {
    sourceSets.main.java.excludes += [
        // 渲染大修文件本体
        "gbeic/bbsplusplus/client/renderer/AAAParticleFormRenderer.java",
        "gbeic/bbsplusplus/client/screen/ModelTextureGradeShader.java",
        "gbeic/bbsplusplus/client/screen/VanillaParticleGradeContext.java",
        "gbeic/bbsplusplus/compat/vfx/VfxCoreShaderRegistrationGuard.java",
        // 引用被排除类的下游文件（BBSEffectLoader 依赖尚未移植的 AAAParticleFormRenderer）
        "gbeic/bbsplusplus/client/renderer/BBSEffectLoader.java",
        "gbeic/bbsplusplus/client/screen/TextureGradeRenderContext.java",
        // Mixin 引用被排除类或使用旧渲染 API
        "gbeic/bbsplusplus/mixin/BillboardFormRendererMixin.java",
        "gbeic/bbsplusplus/mixin/client/CubicVAORendererMixin.java",
        "gbeic/bbsplusplus/mixin/client/ParticleComponentAppearanceBillboardMixin.java",
        "gbeic/bbsplusplus/mixin/client/ParticleEmitterMixin.java",
        "gbeic/bbsplusplus/mixin/CubicVAORendererLimbCullingMixin.java",
        "gbeic/bbsplusplus/mixin/ExtrudedFormRendererMixin.java",
        "gbeic/bbsplusplus/mixin/ModelFormRendererEquipmentMixin.java",
        "gbeic/bbsplusplus/mixin/ModelInstanceMixin.java",
        "gbeic/bbsplusplus/mixin/client/ModelFormRendererLimbPickMixin.java",
        "gbeic/bbsplusplus/mixin/ModelInstanceOutlineMixin.java",
        "gbeic/bbsplusplus/mixin/ModelVAORendererMixin.java",
        "gbeic/bbsplusplus/mixin/MotionPathMixin.java",
        "gbeic/bbsplusplus/mixin/vfx/BbsVfxClientMixin.java",
        "gbeic/bbsplusplus/mixin/vfx/VfxLightsClientMixin.java",
        "gbeic/bbsplusplus/mixin/BOBJModelVAOMixin.java",
        "gbeic/bbsplusplus/mixin/ModelVAOMixin.java",
        "gbeic/bbsplusplus/mixin/CubicCubeRendererUvEmitMixin.java",
        "gbeic/bbsplusplus/mixin/GameRendererMixin.java",
        // Model Morph 只在 1.20.x 源码集里实现（1.21.11 不在本次范围内），
        // 这里登记后 processResources 会把这些条目从所有 mixins.json 中移除，
        // 避免 1.21.11 启动时出现找不到 mixin 类的悬空配置。
        "gbeic/bbsplusplus/mixin/morph/ModelMorphKeyframeMixin.java",
        "gbeic/bbsplusplus/mixin/morph/ModelFormMorphMixin.java",
        "gbeic/bbsplusplus/mixin/morph/ModelFormRendererMorphMixin.java",
        "gbeic/bbsplusplus/mixin/morph/PropertyTrackMorphMixin.java",
        "gbeic/bbsplusplus/mixin/morph/FormPropertiesMorphMixin.java",
        "gbeic/bbsplusplus/mixin/morph/ModelInstanceMorphMixin.java",
        "gbeic/bbsplusplus/mixin/morph/CubicCubeRendererMorphMixin.java",
        "gbeic/bbsplusplus/mixin/morph/ModelMorphReloadMixin.java",
        "gbeic/bbsplusplus/mixin/morph/UIModelKeyframeFactoryMorphMixin.java",
        "gbeic/bbsplusplus/mixin/morph/TextureTranslucentAccessor.java",
        "gbeic/bbsplusplus/mixin/irlite/IRLiteBbsCasterSourceMixin.java",
        "gbeic/bbsplusplus/mixin/irlite/LegacyIRLiteBbsCasterSourceMixin.java",
        "gbeic/bbsplusplus/mixin/shadercurves/CenterDepthSamplerMixin.java",
        "gbeic/bbsplusplus/mixin/shadercurves/IrisRenderingPipelineMixin.java",
        "gbeic/bbsplusplus/mixin/shadercurves/ShadowRendererMixin.java",
        "gbeic/bbsplusplus/mixin/client/BBSShadersTextureGradeMixin.java",
        "gbeic/bbsplusplus/mixin/client/ModelInstanceTextureGradeMixin.java",
        "gbeic/bbsplusplus/mixin/client/ParticleManagerVanillaFormMixin.java",
        "gbeic/bbsplusplus/mixin/client/CustomVertexConsumerTextureGradeMixin.java",
        "gbeic/bbsplusplus/mixin/client/TrailFormRendererMixin.java",
        "gbeic/bbsplusplus/mixin/client/BBSRenderingMixin.java",
        // Particle 字段在 1.21.11 重命名
        "gbeic/bbsplusplus/mixin/client/ParticleColorAccessor.java",
        // 第二批连锁引用
        "gbeic/bbsplusplus/client/ui/forms/editors/panels/UIAAAParticleFormPanel.java",
        "gbeic/bbsplusplus/client/ui/utils/UIEffectPicker.java",
        "gbeic/bbsplusplus/mixin/client/FormRendererTextureGradeContextMixin.java",
        "gbeic/bbsplusplus/mixin/EffekAssetLoaderMixin.java",
        "gbeic/bbsplusplus/mixin/EffectDefinitionMixin.java",
        // 第三批连锁
        "gbeic/bbsplusplus/client/ui/forms/editors/forms/UIAAAParticleForm.java",
    ]
}

// 按版本分离的同名源码（同一 FQN，靠 source dir 互斥）：
// - src/main/java-1.20.x  下是 1.20.1 / 1.20.4 版本（旧立即模式 API）
// - src/main/java-1.21.11 下是 1.21 RenderPipeline API 移植版
// 现有：FluidFormRenderer、OutlineRenderer、ItemSpray、ParticlePlus 的粒子组件与 Additive 层、
// ParticleEditorFileControls（1.20.x 自建快照历史；1.21.11 上游面板已内建 undo，只保留另存为）。
// 注意：不能用 sourceSets.excludes 来排除，因为 excludes 是按“相对 srcDir 的路径模式”匹配的，
// 会把 java-1.21.11 下的同名移植版一起排掉（曾经导致移植版从未被编译、运行期只剩图标占位）。
if (targetMc == "1.21.11") {
    sourceSets.main.java.srcDir "src/main/java-1.21.11"
    // Model Morph 的实现和测试仅适用于 1.20.x，其余测试继续通过 check 运行。
    sourceSets.test.java.exclude(
            "gbeic/bbsplusplus/client/morph/**",
            "gbeic/bbsplusplus/client/ui/morph/**",
            "gbeic/bbsplusplus/mixin/morph/**"
    )
} else {
    sourceSets.main.java.srcDir "src/main/java-1.20.x"
}

// Loom 直接读取所选版本的源 AW，资源任务按模组元数据要求重命名。
def outlineAwSource = layout.projectDirectory.file(targetMc == "1.21.11"
        ? "gradle/outline-1.21.11.accesswidener"
        : "gradle/outline-empty.accesswidener")

// ---- 模组元数据与版本专属资源 ----
def mixin12111Config = "bbsplusplus-12111.mixins.json"
def modelGradients = ["model_grade.vsh", "model_grade.fsh", "model_glint.vsh", "model_glint.fsh"]
def shaderOverrides = fileTree("src/main/resources-shared/shaders-1.21.11")
def modMetadata = [
        version: version,
        mod_id: mod_id,
        mod_name: mod_name,
        mod_license: mod_license,
        minecraft_version_range: minecraftVersionRange,
        loader_version_range: loaderVersionRange,
        java_version_range: javaVersionRange
]
def excludedMixinClasses = sourceSets.main.java.excludes
        .findAll { it.contains("/mixin/") && it.endsWith(".java") }
        .collect { it.substring(0, it.length() - ".java".length()).replace('/', '.') }
        .sort()

def writeJson = { File output, Object value ->
    output.setText(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(value)) + "\n", "UTF-8")
}

processResources {
    inputs.properties(modMetadata)
    inputs.property("targetMc", targetMc)
    inputs.property("excludedMixinClasses", excludedMixinClasses)
    filesMatching("fabric.mod.json") {
        expand(modMetadata)
    }

    from(outlineAwSource) {
        rename { "bbsplusplus.accesswidener" }
    }

    if (targetMc == "1.21.11") {
        inputs.files(shaderOverrides).withPathSensitivity(PathSensitivity.RELATIVE)
        // 旧版 shader JSON 会重复声明 1.21.11 管线已经提供的 uniform。
        exclude "assets/bbs/shaders/core/model.json"
    } else {
        exclude mixin12111Config
        exclude modelGradients.collect { "assets/bbsplusplus/shaders/core/${it}".toString() }
    }

    doLast {
        File output = destinationDir
        def parser = new groovy.json.JsonSlurper()

        if (targetMc == "1.21.11") {
            copy {
                from shaderOverrides
                into output
            }

            fileTree(output).matching { include "*.mixins.json" }.each { configFile ->
                def config = parser.parse(configFile, "UTF-8")
                if (config.compatibilityLevel == "JAVA_17") {
                    config.compatibilityLevel = "JAVA_21"
                }

                ["mixins", "client", "server"].each { section ->
                    if (config.containsKey(section)) {
                        config[section] = config[section].findAll { name ->
                            !excludedMixinClasses.contains("${config['package']}.${name}".toString())
                        }
                    }
                }

                writeJson(configFile, config)
            }
        } else {
            File metadataFile = new File(output, "fabric.mod.json")
            def metadata = parser.parse(metadataFile, "UTF-8")
            metadata.mixins.remove(mixin12111Config)
            writeJson(metadataFile, metadata)
        }
    }
}

loom {
    accessWidenerPath = outlineAwSource.asFile

    runs {
        client {
            vmArg "-Dsodium.checks.issue2561=false"
            // 按游戏版本隔离运行目录，避免 1.20.1 / 1.20.4 的 mods、saves、config 互相冲突
            runDir = "run/${minecraftVersion}"
        }
    }
}

apply from: "gradle/private-dev-runtime.gradle"

// ---- 多版本构建 / 运行客户端便捷任务 ----
// 通过 GradleBuild 嵌套构建传 mc_version，避免 PowerShell 下 -P 参数被截断，
// 同时让构建与运行客户端各自按版本使用独立的 run 目录（run/1.20.1、run/1.20.4）。

// --offline 下 Gradle 不下载任何依赖，Loom 也不会重新拉取版本元数据。缓存不完整时
// 只会得到 "Failed download after 3 attempts" 或成片的 "程序包 net.fabricmc.api 不存在"，
// 这里提前检查并给出可直接执行的提示，避免把缓存问题误判成代码问题。
def offlineCacheProblems = { String version ->
    def problems = []

    [
            "fabric-loader": project.findProperty("loader_version_${version}".toString()),
            "yarn"         : project.findProperty("yarn_mappings_${version}".toString())
    ].each { artifact, artifactVersion ->
        if (artifactVersion == null) {
            return
        }
        def artifactDir = new File(gradle.gradleUserHomeDir,
                "caches/modules-2/files-2.1/net.fabricmc/${artifact}/${artifactVersion}")
        if (fileTree(artifactDir).matching { include "**/*.jar", "**/*.tiny" }.isEmpty()) {
            problems << "Gradle 依赖缓存缺少 net.fabricmc:${artifact}:${artifactVersion}"
        }
    }

    def loomDir = new File(gradle.gradleUserHomeDir, "caches/fabric-loom/${version}")
    def hasVersionInfo = new File(loomDir, "mojang_minecraft_info.json").isFile()
    def hasMinecraftJar = new File(loomDir, "minecraft-merged.jar").isFile() ||
            new File(loomDir, "minecraft-client.jar").isFile()
    if (!hasVersionInfo || !hasMinecraftJar) {
        problems << "Loom 缓存缺少 Minecraft ${version} 的版本元数据（${loomDir}）"
    }

    return problems
}

def registerVersionTask = { name, version, taskList, description ->
    tasks.register(name, GradleBuild) {
        group = "bbsplusplus"
        description = description
        dir = rootDir
        tasks = taskList
        startParameter.projectProperties = [mc_version: version]
        doFirst {
            if (!gradle.startParameter.offline) {
                return
            }
            def problems = offlineCacheProblems(version)
            if (!problems.isEmpty()) {
                throw new GradleException("离线构建 ${version} 中止：本地依赖缓存不完整。\n" +
                        problems.collect { "  - ${it}" }.join("\n") +
                        "\n请先联网执行一次 .\\gradlew.bat ${name} 补全缓存，再使用 --offline 构建。")
            }
        }
    }
}

