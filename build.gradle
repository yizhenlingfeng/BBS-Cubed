loom {
    runs {
        client {
            vmArg "-Dsodium.checks.issue2561=false"
            // 按游戏版本隔离运行目录，避免 1.20.1 / 1.20.4 的 mods、saves、config 互相冲突
            runDir = "run/${minecraftVersion}"
        }
    }
}

// 私有扩展存在时加载本地开发联动；公开环境没有该目录，不会产生任何依赖。
def bbspppDevScript = file("private/BBSPPP/bbsplusplus-dev.gradle")
def mediaPlayerDevScript = file("private/MediaPlayer-BBS/bbsplusplus-dev.gradle")

if (bbspppDevScript.exists()) {
    apply from: bbspppDevScript
}

if (mediaPlayerDevScript.exists()) {
    apply from: mediaPlayerDevScript
}

def privateDevRuntimeMods = [
        [
                buildTask: "buildBbspppDevRuntime",
                runTask: "runClientWithbbspppBuild",
                displayName: "BBSPPP"
        ],
        [
                buildTask: "buildMediaPlayerDevRuntime",
                runTask: "runClientWithMediaPlayerBuild",
                displayName: "MediaPlayer-BBS"
        ]
].findAll { tasks.findByName(it.buildTask) != null }

def privateDevRuntimeBuildTasks = privateDevRuntimeMods.collect { it.buildTask }

if (!privateDevRuntimeBuildTasks.isEmpty()) {
    tasks.register("buildPrivateDevRuntime") {
        group = "bbsplusplus"
        description = "强制重建所有可用的 private mod 开发运行包。"
        dependsOn privateDevRuntimeBuildTasks.collect { tasks.named(it) }
    }

    tasks.named("runClient") {
        mustRunAfter tasks.named("buildPrivateDevRuntime")
        privateDevRuntimeBuildTasks.each { buildTask ->
            mustRunAfter tasks.named(buildTask)
        }
    }

    privateDevRuntimeMods.each { mod ->
        tasks.register(mod.runTask, GradleBuild) {
            group = "fabric"
            description = "强制重建 ${mod.displayName} 开发运行包，并在新的 Gradle 构建中启动客户端。"
            dependsOn project.tasks.named(mod.buildTask)
            dir = rootDir
            tasks = ["runClient"]
        }
    }

    tasks.register("runClientWithPrivateBuild", GradleBuild) {
        group = "fabric"
        description = "强制重建 private mod 开发运行包，并在新的 Gradle 构建中启动客户端。"
        dependsOn tasks.named("buildPrivateDevRuntime")
        dir = rootDir
        tasks = ["runClient"]
    }
}

// ---- 多版本构建 / 运行客户端便捷任务 ----
// 通过 GradleBuild 嵌套构建传 mc_version，避免 PowerShell 下 -P 参数被截断，
// 同时让构建与运行客户端各自按版本使用独立的 run 目录（run/1.20.1、run/1.20.4）。
def registerVersionTask = { name, version, taskList, description ->
    tasks.register(name, GradleBuild) {
        group = "bbsplusplus"
        description = description
        dir = rootDir
        tasks = taskList
        startParameter.projectProperties = [mc_version: version]
    }
}

registerVersionTask("build1201", "1.20.1", ["build"], "构建发布 jar（单 jar 兼容 1.20.1 ~ 1.20.4）。")
registerVersionTask("build12111", "1.21.11", ["build"], "以 Minecraft 1.21.11 为目标构建。")
registerVersionTask("runClient1201", "1.20.1", ["runClient"], "以 Minecraft 1.20.1 启动开发客户端（运行目录 run/1.20.1）。")
registerVersionTask("runClient1204", "1.20.4", ["runClient"], "以 Minecraft 1.20.4 启动开发客户端（编译回归测试用，运行目录 run/1.20.4）。")
registerVersionTask("runClient12111", "1.21.11", ["runClient"], "以 Minecraft 1.21.11 启动开发客户端（运行目录 run/1.21.11）。")
