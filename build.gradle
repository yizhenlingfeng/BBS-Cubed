plugins {
    id 'fabric-loom' version "${loom_version}"
}

base {
    archivesName = archives_base_name
}

version = mod_version
group = mod_group_id

processResources {
    inputs.properties(
        version: mod_version,
        mod_id: mod_id,
        mod_name: mod_name,
        mod_license: mod_license,
        minecraft_version_range: minecraft_version_range,
        loader_version_range: loader_version_range,
        java_version_range: java_version_range
    )

    filesMatching("fabric.mod.json") {
        expand(
            version: mod_version,
            mod_id: mod_id,
            mod_name: mod_name,
            mod_license: mod_license,
            minecraft_version_range: minecraft_version_range,
            loader_version_range: loader_version_range,
            java_version_range: java_version_range
        )
    }
}

repositories {
    mavenCentral()
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
    }
    maven {
        name = "Architectury"
        url = "https://maven.architectury.dev/"
    }
    maven {
        name = "Gegy"
        url = "https://maven.gegy.dev/"
    }
    maven {
        name = "Fuzs Mod Repository"
        url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/"
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings "net.fabricmc:yarn:${yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"

    // Fabric API（提供 ClientTickEvents、ClientLifecycleEvents 等）
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    // 引用本地 BBS FS 2.5.1（run/mods 中的实际运行版本），编译期解析 Mixin 目标类
    modCompileOnly files("run/mods/bbs-2.5.1-1.20.1-FS-zh_CN.jar")

    // Iris 光影（仅编译期）：光影曲线相关 Mixin 需要引用 Iris 的类，运行时没装 Iris 也不会加载这些注入
    modCompileOnly "maven.modrinth:iris:${iris_version}"

    // AAA Particles 依赖
    modImplementation "maven.modrinth:aaa-particles:${aaa_particles_version}"
    modImplementation "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${forgeconfigapiport_version}"

    // aaa_particles 以 jar-in-jar 内置 architectury（9.2.14），但 loom dev 环境不解包嵌套 jar，
    // 需显式声明才能在 runClient 中加载；版本与内置一致，且不会打进最终产物
    modImplementation "dev.architectury:architectury-fabric:${architectury_version}"

    // BBS VFX 与 VFX Lights（仅编译期）：轨道关键帧汉化需要引用其 Form 类做上下文判断，
    // 运行时由用户自行安装这两个插件
    modCompileOnly files("libs/BBS-VFX-build-1.3-1.20.1-zh_cn-hardcoded.jar")
    modCompileOnly files("libs/VFX-LIGHTS-1.0-1.20.1-zh_cn-hardcoded.jar")
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = java_version as int
    it.options.encoding = 'UTF-8'
}

loom {
    runs {
        client {
            vmArg "-Dsodium.checks.issue2561=false"
        }
    }
}

// 私有扩展存在时加载本地开发联动；公开环境没有该目录，不会产生任何依赖。
def bbspppDevScript = file("private/BBSPPP/bbsplusplus-dev.gradle")
def mediaPlayerDevScript = file("private/MediaPlayer-BBS/bbsplusplus-dev.gradle")

if (bbspppDevScript.exists()) {
    apply from: bbspppDevScript
}

if (mediaPlayerDevScript.exists()) {
    apply from: mediaPlayerDevScript
}

def privateDevRuntimeMods = [
        [
                buildTask: "buildBbspppDevRuntime",
                runTask: "runClientWithbbspppBuild",
                displayName: "BBSPPP"
        ],
        [
                buildTask: "buildMediaPlayerDevRuntime",
                runTask: "runClientWithMediaPlayerBuild",
                displayName: "MediaPlayer-BBS"
        ]
].findAll { tasks.findByName(it.buildTask) != null }

def privateDevRuntimeBuildTasks = privateDevRuntimeMods.collect { it.buildTask }

if (!privateDevRuntimeBuildTasks.isEmpty()) {
    tasks.register("buildPrivateDevRuntime") {
        group = "bbsplusplus"
        description = "强制重建所有可用的 private mod 开发运行包。"
        dependsOn privateDevRuntimeBuildTasks.collect { tasks.named(it) }
    }

    tasks.named("runClient") {
        mustRunAfter tasks.named("buildPrivateDevRuntime")
        privateDevRuntimeBuildTasks.each { buildTask ->
            mustRunAfter tasks.named(buildTask)
        }
    }

    privateDevRuntimeMods.each { mod ->
        tasks.register(mod.runTask, GradleBuild) {
            group = "fabric"
            description = "强制重建 ${mod.displayName} 开发运行包，并在新的 Gradle 构建中启动客户端。"
            dependsOn project.tasks.named(mod.buildTask)
            dir = rootDir
            tasks = ["runClient"]
        }
    }

    tasks.register("runClientWithPrivateBuild", GradleBuild) {
        group = "fabric"
        description = "强制重建 private mod 开发运行包，并在新的 Gradle 构建中启动客户端。"
        dependsOn project.tasks.named("buildPrivateDevRuntime")
        dir = rootDir
        tasks = ["runClient"]
    }
}
