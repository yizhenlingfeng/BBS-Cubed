# Gradle 守护进程 JVM 约束（Gradle 8.8+ 官方机制，由 wrapper / IDE Tooling API 共同遵守）。
# 作用：无论 JAVA_HOME 指向哪个 JDK，Gradle 都强制用 JDK 21 启动守护进程，
# 从而避免 fabric-loom 1.15（要求运行 JVM >= 21）与 --release 21 编译在不同 JVM 之间割裂，
# 也就不会再出现「错误: 不支持发行版本 21」。
# 若本机没有可被 Gradle 自动探测到的 JDK 21，构建会明确报“找不到匹配的 toolchain”，
# 而不是抛出难以定位的 javac 报错。
toolchainVersion=21
